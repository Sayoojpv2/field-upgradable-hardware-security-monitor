name: ci

on:
  push:
  pull_request:

env:
  PYTHONUNBUFFERED: "1"   # progress lines reach the log even if a step is cancelled

jobs:
  build-test:
    runs-on: ubuntu-24.04   # pinned: Icarus/GCC versions differ between images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator and compiler
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc make

      - name: Tool versions
        run: |
          iverilog -V 2>&1 | head -1
          gcc --version | head -1
          python3 --version

      - name: C tests under AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          make test-c PYTHON=python3 CFLAGS="-std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"
          rm -f build/fw/test_firmware   # rebuild without sanitizers below

      - name: Python, C, RTL tests and mutation check
        run: make test PYTHON=python3

      - name: Synthesis (Yosys via yowasp)
        run: make synth PYTHON=python3 YOSYS=.venv/bin/yowasp-yosys

      - name: End-to-end demo
        run: make demo PYTHON=python3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            build/results/
            build/reports/

  # Formal verification with the same engine used locally (Yosys built-in SAT via yowasp-yosys).
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Proofs, BMC, covers and planted-bug check
        run: make formal PYTHON=python3 YOSYS=.venv/bin/yowasp-yosys
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal
          path: |
            results/formal.json
            build/formal/*.log
            build/formal/*.vcd

  # The same harnesses under SymbiYosys with an SMT solver, from a pinned OSS CAD Suite release.
  formal-sby:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite 2026-11-14 (pinned)
        run: |
          curl -fsSL -o ocs.tgz https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-14/oss-cad-suite-linux-x64-20261114.tgz
          tar -xzf ocs.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: SymbiYosys k-induction (smtbmc + yices); any non-PASS task fails the job
        run: cd formal && sby -f hsm.sby
      # Non-vacuity: the same planted bugs as scripts/mutation_check.py must give a concrete FAIL.
      - name: SymbiYosys non-vacuity, planted bugs must FAIL
        run: |
          for pair in "bank writes reach the ACTIVE bank:bank" "monitor ignores privilege requirement:monitor_sound"; do
            bug="${pair%%:*}"; task="${pair##*:}"
            python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from mutation_check import MUTANTS; d, f, a, b = next(m for m in MUTANTS if m[0] == sys.argv[1]); p = Path("rtl") / f; s = p.read_text(); assert s.count(a) == 1, d; p.write_text(s.replace(a, b))' "$bug"
            if (cd formal && sby -f hsm.sby "$task" > "../sby_mutant_$task.log"); then
              echo "::error::planted bug '$bug' was not caught by task $task"; exit 1
            fi
            grep -q "DONE (FAIL" "sby_mutant_$task.log" || { tail -20 "sby_mutant_$task.log"; exit 1; }
            echo "caught: $bug (task $task FAIL)"
            git checkout -- rtl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-sby
          path: |
            formal/hsm_*/status
            formal/hsm_*/logfile.txt
            sby_mutant_*.log
